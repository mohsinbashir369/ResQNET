server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application.name: resqnet-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resqnet}
    username: ${SPRING_DATASOURCE_USERNAME:resqnet}
    password: ${SPRING_DATASOURCE_PASSWORD:LocalOnly-Database-2026!}
  flyway:
    enabled: true
  data.redis:
    host: ${SPRING_DATA_REDIS_HOST:localhost}
    port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: resqnet-api
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    serialization.write-dates-as-timestamps: false
resqnet:
  web:
    allowed-origins: ${RESQNET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  routing:
    base-url: ${RESQNET_ROUTING_BASE_URL:https://router.project-osrm.org}
  demo:
    auto-start: ${RESQNET_DEMO_AUTO_START:false}
    tick-ms: ${RESQNET_DEMO_TICK_MS:2000}
  auth:
    token-ttl: PT8H
    hospital-admin-username: ${RESQNET_HOSPITAL_ADMIN_USERNAME:admin}
    hospital-admin-password: ${RESQNET_HOSPITAL_ADMIN_PASSWORD:password}
    paramedic-username: ${RESQNET_PARAMEDIC_USERNAME:admin}
    paramedic-password: ${RESQNET_PARAMEDIC_PASSWORD:password}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
